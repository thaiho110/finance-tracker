version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ft-postgres-dev
    environment:
      POSTGRES_DB: finance_tracker
      POSTGRES_USER: ft_user
      POSTGRES_PASSWORD: ft_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ft_user -d finance_tracker"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ft-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@financetracker.com
      PGADMIN_DEFAULT_PASSWORD: devpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - gui

volumes:
  pgdata-dev:
