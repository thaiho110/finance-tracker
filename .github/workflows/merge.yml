name: Merge to Main

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Verify Docker is available (required for Testcontainers)
        run: docker version

      - name: Pre-pull PostgreSQL image (speeds up Testcontainers)
        run: docker pull postgres:17-alpine

      - name: Run tests with coverage
        run: cd backend && ./gradlew test jacocoTestReport --no-daemon

      - name: Coverage verification
        run: cd backend && ./gradlew jacocoTestCoverageVerification --no-daemon
        continue-on-error: ${{ github.event.inputs.enforce-coverage != 'true' }}
        env:
          # Toggle coverage enforcement via GitHub Actions UI:
          # Set enforce-coverage to 'true' to block merges below threshold
          ENFORCE_COVERAGE: ${{ github.event.inputs.enforce-coverage || 'false' }}

      - name: Display coverage percentage
        run: |
          REPORT=backend/build/reports/jacoco/test/html/index.html
          if [ -f "$REPORT" ]; then
            echo "## JaCoCo Coverage Summary" >> $GITHUB_STEP_SUMMARY
            grep -oP '(instruction|line|branch|method|class)\s+\d+%\s*\(\d+/\d+\)' "$REPORT" \
              | sed 's/^/| /' \
              | awk 'BEGIN{print "| Type | Coverage |"; print "|------|----------|"} {print "|" $0 "|"}' \
              >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Detailed Coverage" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -oP '(instruction|line|branch|method|class)\s+\d+%\s*\(\d+/\d+\)' "$REPORT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ JaCoCo report not found at $REPORT"
          fi

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-main
          path: backend/build/reports/jacoco/
          retention-days: 30

      - name: Upload test report
        uses: actions/upload-artifact@v5
        with:
          name: test-results-main
          path: backend/build/reports/tests/
          retention-days: 30
