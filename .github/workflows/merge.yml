name: Merge to Main

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests with coverage
        run: cd backend && ./gradlew test jacocoTestReport --no-daemon

      - name: Coverage verification
        run: cd backend && ./gradlew jacocoTestCoverageVerification --no-daemon
        continue-on-error: ${{ github.event.inputs.enforce-coverage != 'true' }}
        env:
          # Toggle coverage enforcement via GitHub Actions UI:
          # Set enforce-coverage to 'true' to block merges below threshold
          ENFORCE_COVERAGE: ${{ github.event.inputs.enforce-coverage || 'false' }}

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-main
          path: backend/build/reports/jacoco/
          retention-days: 30

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-main
          path: backend/build/reports/tests/
          retention-days: 30
