name: PR Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: cd backend && ./gradlew check --no-daemon

      - name: Run quality checks
        run: cd backend && ./gradlew checkstyleMain pmdMain spotbugsMain --no-daemon
        continue-on-error: true

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/build/reports/jacoco/
          retention-days: 14

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            backend/build/reports/checkstyle/
            backend/build/reports/pmd/
            backend/build/reports/spotbugs/
          retention-days: 14
